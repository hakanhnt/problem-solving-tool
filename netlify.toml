# Netlify yapılandırması — Problem Çözme Akışı
# Ortam değişkenleri (Site settings > Environment variables):
#   MINIMAX_API_KEY   (zorunlu) — MiniMax API anahtarınız
#   MINIMAX_MODEL     (isteğe bağlı, varsayılan: MiniMax-Text-01)
#   MINIMAX_BASE_URL  (isteğe bağlı, varsayılan: https://api.minimax.io/v1/text/chatcompletion_v2)

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
